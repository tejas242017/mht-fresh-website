<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MHT Fresh | Media Library</title>
<style>
:root{--green:#08752e;--deep:#073c20;--ink:#15261b;--muted:#5e6c63;--line:#dce4dd;--bg:#f6f8f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,sans-serif}.wrap{width:min(1240px,94%);margin:auto}.top{background:var(--deep);color:#fff;padding:18px 0}.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:15px}.top a{color:#e1f3c9}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin:22px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select,button{font:inherit;padding:11px 13px;border:1px solid #bac9bd;border-radius:7px}input[type=search]{flex:1;min-width:220px}button{cursor:pointer;background:var(--green);color:white;border-color:var(--green);font-weight:700}button.secondary{background:white;color:var(--deep)}button.reject{background:#fff;color:#a32626;border-color:#e5bcbc}.hint,.status{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.photo{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:white}.photo img{width:100%;height:180px;object-fit:cover;display:block;background:#edf3ed}.body{padding:12px}.body p{margin:4px 0 10px;font-size:13px;color:var(--muted)}.body a{color:var(--green)}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;padding:9px 5px;font-size:13px}.statusline{padding:10px;background:#f1f6ef;border-radius:8px;margin-top:12px;min-height:42px}.library{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line)}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.top .wrap{align-items:flex-start;flex-direction:column}}@media(max-width:420px){.grid{grid-template-columns:1fr}.photo img{height:210px}}
</style></head><body>
<header class="top"><div class="wrap"><strong>MHT FRESH · MEDIA LIBRARY</strong><a href="index.html">← Back to website</a></div></header>
<main class="wrap"><section class="panel"><h1 style="margin:0 0 5px">Image search & approval</h1><p class="hint">Private admin tool. Unsplash API keys remain server-side. Images are hotlinked from Unsplash; approvals are tracked in the MHT media database.</p>
<div class="row"><input id="token" type="password" autocomplete="current-password" placeholder="MHT media admin token" aria-label="Admin token"><input id="query" type="search" placeholder="Search apples, mandarins, orchards, dragon fruit…" aria-label="Search images"><select id="usage"><option>Homepage</option><option>Fruit profile</option><option>Banner</option><option>Article</option><option>Operations / logistics</option><option>Unassigned</option></select><button id="search">Search Unsplash</button></div><div class="statusline" id="status" role="status">Enter your admin token and a search keyword.</div></section>
<section class="panel"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Search results</h2><span class="hint" id="count"></span></div><div class="grid" id="results" style="margin-top:15px"></div></section>
<section class="panel library"><div class="row" style="justify-content:space-between"><h2 style="margin:0">MHT Fresh image library</h2><button class="secondary" id="refresh">Refresh library</button></div><div id="library" style="margin-top:12px"></div></section></main>
<script>
const $=id=>document.getElementById(id);let current=[];
function token(){return $("token").value.trim()}
function say(s){$("status").textContent=s}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{...(options.headers||{}),Authorization:"Bearer "+token(),...(options.body?{"Content-Type":"application/json"}:{})}});const d=await r.json().catch(()=>({error:"Invalid server response"}));if(!r.ok)throw new Error(d.error||"Request failed ("+r.status+")");return d}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function search(){if(!token())return say("Admin token is required.");const q=$("query").value.trim();if(!q)return say("Enter a search keyword.");say("Searching Unsplash…");$("results").innerHTML="";try{const d=await api("/api/media/search?query="+encodeURIComponent(q));current=d.results||[];$("count").textContent=(d.total||0).toLocaleString()+" matching photos";$("results").innerHTML=current.map((p,i)=>'<article class="photo"><img src="'+esc(p.urls.preview)+'" alt="'+esc(p.description)+'" loading="lazy"><div class="body"><strong>'+esc(p.description||"Untitled photo")+'</strong><p>Photo by <a target="_blank" rel="noopener" href="'+esc(p.photographerUrl)+'?utm_source=mht_fresh&utm_medium=referral">'+esc(p.photographer)+'</a> on <a target="_blank" rel="noopener" href="https://unsplash.com/?utm_source=mht_fresh&utm_medium=referral">Unsplash</a></p><a target="_blank" rel="noopener" href="'+esc(p.photoUrl)+'">Open original ↗</a><div class="actions"><button data-approve="'+i+'">Approve</button><button class="reject" data-reject="'+i+'">Reject</button></div></div></article>').join("");say("Search complete. Preview carefully, then approve or reject each image.");}catch(e){say(e.message)}}
async function decide(i,status){const p=current[i];if(!p)return;try{say(status==="approved"?"Tracking selection and saving approval…":"Saving rejection…");await api("/api/media/decision",{method:"POST",body:JSON.stringify({status,usage:$("usage").value,photo:{id:p.id,description:p.description,previewUrl:p.urls.preview,fullUrl:p.urls.full,photographer:p.photographer,photographerUsername:p.photographerUsername,photographerUrl:p.photographerUrl,photoUrl:p.photoUrl,downloadLocation:p.downloadLocation}})});say("Image "+status+".");await library();}catch(e){say(e.message)}}
async function library(){if(!token())return;try{const d=await api("/api/media/library");const rows=d.results||[];$("library").innerHTML=rows.length?'<table><thead><tr><th>Preview</th><th>Photographer / source</th><th>Status</th><th>Usage</th><th>Image ID</th></tr></thead><tbody>'+rows.map(p=>'<tr><td><img src="'+esc(p.preview_url)+'" alt="" width="84"></td><td>'+esc(p.photographer)+'<br><a href="'+esc(p.photographer_url)+'?utm_source=mht_fresh&utm_medium=referral" target="_blank" rel="noopener">Photographer profile</a> · <a href="'+esc(p.source_page_url)+'" target="_blank" rel="noopener">Source</a></td><td>'+esc(p.status)+'</td><td>'+esc(p.usage_location)+'</td><td>'+esc(p.source_id)+'</td></tr>').join("")+'</tbody></table>':'<p class="hint">No approved or rejected images saved yet.</p>';}catch(e){$("library").textContent=e.message}}
$("search").addEventListener("click",search);$("refresh").addEventListener("click",library);$("results").addEventListener("click",e=>{const a=e.target.closest("[data-approve]"),r=e.target.closest("[data-reject]");if(a)decide(Number(a.dataset.approve),"approved");if(r)decide(Number(r.dataset.reject),"rejected")});$("token").addEventListener("change",library);$("query").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
</script></body></html>
